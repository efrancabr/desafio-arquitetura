services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluxocaixa
      POSTGRES_PASSWORD: fluxocaixa
      POSTGRES_DB: fluxocaixa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxocaixa"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  dbinit:
    build:
      context: .
      dockerfile: src/DbInit/Dockerfile
    environment:
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=fluxocaixa;Username=fluxocaixa;Password=fluxocaixa
    depends_on:
      postgres:
        condition: service_healthy

  lancamentos-api:
    build:
      context: .
      dockerfile: src/Lancamentos.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=fluxocaixa;Username=fluxocaixa;Password=fluxocaixa
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__User=guest
      - RabbitMQ__Password=guest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dbinit:
        condition: service_completed_successfully

  consolidado-worker:
    build:
      context: .
      dockerfile: src/Consolidado.Worker/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=fluxocaixa;Username=fluxocaixa;Password=fluxocaixa
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__User=guest
      - RabbitMQ__Password=guest
    depends_on:
      dbinit:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  consolidado-api:
    build:
      context: .
      dockerfile: src/Consolidado.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=fluxocaixa;Username=fluxocaixa;Password=fluxocaixa
    ports:
      - "8081:8080"
    depends_on:
      dbinit:
        condition: service_completed_successfully

volumes:
  pgdata:
